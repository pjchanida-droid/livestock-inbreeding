kind = "web"
previewPath = "/"
title = "ระบบทำนายอัตราเลือดชิด"
version = "1.0.0"
id = "artifacts/livestock-inbreeding"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22171

[services.development]
run = "pnpm --filter @workspace/livestock-inbreeding run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/livestock-inbreeding", "run", "build" ]
publicDir = "artifacts/livestock-inbreeding/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22171"
BASE_PATH = "/"
