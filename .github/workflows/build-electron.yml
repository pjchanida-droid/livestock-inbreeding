name: Build Electron Windows App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Remove Linux-only overrides from workspace config
        shell: pwsh
        run: |
          $content = Get-Content pnpm-workspace.yaml -Raw
          # Remove the entire overrides block (Linux/macOS/Android-only exclusions)
          # We keep the file but clear the overrides so Windows packages install correctly
          $content = $content -replace '(?ms)^overrides:.*', ''
          Set-Content pnpm-workspace.yaml $content

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/livestock-inbreeding run build

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build Electron (compile TypeScript)
        working-directory: artifacts/electron-app
        run: pnpm run build

      - name: Create icon placeholder if missing
        shell: pwsh
        run: |
          $iconDir = "artifacts/electron-app/assets"
          if (-not (Test-Path $iconDir)) { New-Item -ItemType Directory -Path $iconDir }
          if (-not (Test-Path "$iconDir/icon.ico")) {
            # Download a generic icon or create a minimal valid .ico
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/electron/electron/main/shell/browser/resources/win/electron.ico" -OutFile "$iconDir/icon.ico"
          }

      - name: Package Electron as Windows installer
        working-directory: artifacts/electron-app
        run: pnpm exec electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: livestock-inbreeding-windows-installer
          path: artifacts/electron-app/dist-electron/*.exe
          retention-days: 30
