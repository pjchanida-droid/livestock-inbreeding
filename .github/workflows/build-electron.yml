name: Build Electron Windows App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Strip Linux-only overrides from pnpm-workspace.yaml
        shell: node {0}
        run: |
          const fs = require('fs');
          let txt = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
          // Remove everything from the "overrides:" key to end of file
          const idx = txt.indexOf('\noverrides:');
          if (idx !== -1) txt = txt.slice(0, idx);
          fs.writeFileSync('pnpm-workspace.yaml', txt);
          console.log('pnpm-workspace.yaml patched — overrides removed');

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/livestock-inbreeding run build

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build Electron (compile TypeScript)
        working-directory: artifacts/electron-app
        run: pnpm run build

      - name: Create icon placeholder if missing
        shell: pwsh
        run: |
          $iconDir = "artifacts/electron-app/assets"
          if (-not (Test-Path $iconDir)) { New-Item -ItemType Directory -Path $iconDir }
          if (-not (Test-Path "$iconDir/icon.ico")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/electron/electron/main/shell/browser/resources/win/electron.ico" -OutFile "$iconDir/icon.ico"
          }

      - name: Package Electron as Windows installer
        working-directory: artifacts/electron-app
        run: pnpm exec electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: livestock-inbreeding-windows-installer
          path: artifacts/electron-app/dist-electron/*.exe
          retention-days: 30
