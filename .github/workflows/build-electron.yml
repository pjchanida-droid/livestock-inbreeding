name: Build Electron Windows App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-assets:
    name: Build frontend & API (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/livestock-inbreeding run build
        env:
          PORT: "3000"
          BASE_PATH: "/"
          NODE_ENV: "production"

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: built-assets
          path: |
            artifacts/livestock-inbreeding/dist
            artifacts/api-server/dist
          retention-days: 1

  package-windows:
    name: Package Windows installer
    needs: build-assets
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: built-assets

      - name: Install Electron dependencies only
        working-directory: artifacts/electron-app
        run: pnpm install

      - name: Build Electron TypeScript
        working-directory: artifacts/electron-app
        run: pnpm run build

      - name: Create icon if missing
        shell: pwsh
        run: |
          $iconDir = "artifacts/electron-app/assets"
          if (-not (Test-Path $iconDir)) { New-Item -ItemType Directory -Path $iconDir | Out-Null }
          if (-not (Test-Path "$iconDir/icon.ico")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/electron/electron/main/shell/browser/resources/win/electron.ico" -OutFile "$iconDir/icon.ico"
          }

      - name: Package Electron as Windows installer
        working-directory: artifacts/electron-app
        run: pnpm exec electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: livestock-inbreeding-windows-installer
          path: artifacts/electron-app/dist-electron/*.exe
          retention-days: 30
