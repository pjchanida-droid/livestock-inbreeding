name: Build Electron Windows App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-assets:
    name: Build frontend & API (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/livestock-inbreeding run build
        env:
          PORT: "3000"
          BASE_PATH: "/"
          NODE_ENV: "production"

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Clear database before packaging
        run: |
          node --experimental-sqlite -e "
          const { DatabaseSync } = require('node:sqlite');
          const db = new DatabaseSync('artifacts/api-server/data/livestock.db');
          db.exec('DELETE FROM inbreeding_history');
          db.exec('DELETE FROM animals');
          db.exec(\"UPDATE sqlite_sequence SET seq=0 WHERE name='animals' OR name='inbreeding_history'\");
          const a = db.prepare('SELECT COUNT(*) as c FROM animals').get();
          const h = db.prepare('SELECT COUNT(*) as c FROM inbreeding_history').get();
          console.log('DB cleared — animals:', a.c, 'history:', h.c);
          db.close();
          " 2>&1 | grep -v ExperimentalWarning || true

      - name: Prepare packaging folder
        run: |
          mkdir -p packaging/server
          mkdir -p packaging/frontend
          cp -r artifacts/api-server/dist/. packaging/server/
          cp -r artifacts/livestock-inbreeding/dist/. packaging/frontend/
          echo "=== server ===" && ls packaging/server
          echo "=== frontend ===" && ls packaging/frontend

      - name: Upload packaging folder
        uses: actions/upload-artifact@v4
        with:
          name: built-assets
          path: packaging/
          retention-days: 1

  package-windows:
    name: Package Windows installer
    needs: build-assets
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Download built assets directly into electron-app
        uses: actions/download-artifact@v4
        with:
          name: built-assets
          path: artifacts/electron-app

      - name: Verify assets
        shell: pwsh
        run: |
          Write-Host "=== server ===" ; Get-ChildItem artifacts/electron-app/server
          Write-Host "=== frontend ===" ; Get-ChildItem artifacts/electron-app/frontend

      - name: Install Electron dependencies
        working-directory: artifacts/electron-app
        run: pnpm install

      - name: Build Electron TypeScript
        working-directory: artifacts/electron-app
        run: pnpm run build

      - name: Bundle Node.js 24 for server runtime
        shell: pwsh
        run: |
          $nodeVersion = "v24.3.0"
          $zipUrl = "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip"
          Write-Host "Downloading Node.js $nodeVersion..."
          Invoke-WebRequest -Uri $zipUrl -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-temp -Force
          Copy-Item "node-temp\node-$nodeVersion-win-x64\node.exe" "artifacts/electron-app/node.exe"
          Write-Host "Bundled node.exe: $((Get-Item artifacts/electron-app/node.exe).Length) bytes"

      - name: Create icon if missing
        shell: pwsh
        run: |
          $iconDir = "artifacts/electron-app/assets"
          if (-not (Test-Path $iconDir)) { New-Item -ItemType Directory -Path $iconDir | Out-Null }
          if (-not (Test-Path "$iconDir/icon.ico")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/electron/electron/main/shell/browser/resources/win/electron.ico" -OutFile "$iconDir/icon.ico"
          }

      - name: Package Electron as Windows installer
        working-directory: artifacts/electron-app
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: livestock-inbreeding-windows-installer
          path: artifacts/electron-app/dist-electron/*.exe
          retention-days: 30
